name: CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Focused lint for provisioning changes
        run: npx eslint src/lib/provisioning.ts src/lib/provisioning-batches.mjs src/lib/provisioning-batches.d.mts tests/provisioning-batches.test.mjs
      - name: Lint
        run: npm run lint
      - name: Focused provisioning typecheck
        run: npm run typecheck:provisioning
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Production build
        if: always()
        run: npm run build
